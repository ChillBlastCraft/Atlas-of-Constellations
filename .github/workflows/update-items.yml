name: Update Wynncraft items

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run getItems probe
        run: node constellations/wynncraft/wynnbuilder/wapi/getItems.js

      - name: Commit updated items.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add constellations/wynncraft/wynnbuilder/wapi/data/items.json || true
          if git diff --staged --quiet; then
            echo "No changes to items.json"
          else
            git commit -m "chore: update items.json"
            git push
          fi