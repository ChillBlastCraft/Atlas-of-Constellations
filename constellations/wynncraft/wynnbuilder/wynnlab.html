<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WynnLab</title>
    <link rel="stylesheet" href="../../../assets/css/style.css">
    <link rel="stylesheet" href="wynnlab.css">
    <script defer src="wynnlab.js"></script>
</head>
<body>

    <div class="sidebar">
        <h1>WynnLab</h1>
        <button id="btn-builder" class="active">WynnBuilder</button>
        <button id="btn-atlas">WynnAtlas</button>
        <button id="btn-crafter">WynnCrafter</button>
    </div>
    <main id="main-content">
        <div id="builder-content">This is WynnBuilder</div>
        <div id="atlas-content" class="hidden">
            <div id="atlas-canvas">
                <div class="atlas-search-row">
                    <input type="text" placeholder="Search Items" class="atlas-search-input" />
                </div>
                <div class="atlas-filters-row">
                    <div class="atlas-type-filters">
                        <label class="atlas-filter-label">
                            <input type="checkbox" class="atlas-type-checkbox" checked />
                            Type Filters
                        </label>
                        <div class="atlas-type-sub">
                            TEST <br>
                            TEST <br>
                            TEST <br>
                            TEST <br>
                            TEST <br>
                            TEST <br>
                            TEST
                        </div>
                    </div>
                    <div class="atlas-stat-filters">
                        <label class="atlas-filter-label">
                            <input type="checkbox" class="atlas-stat-checkbox" checked />
                            Stat Filters
                        </label>
                        <div class="atlas-stat-sub">
                            TEST <br>
                            TEST <br>
                            TEST <br>
                            TEST <br>
                            TEST <br>
                            TEST <br>
                            TEST
                        </div>
                    </div>
                </div>
                <div class="atlas-spacer"></div>
                <div class="atlas-search-btn-row">
                    <button class="atlas-search-btn">Search</button>
                </div>
            </div>
        </div>
        <div id="crafter-content" class="hidden">This is WynnCrafter</div>
    </main>
</body>
</html>
