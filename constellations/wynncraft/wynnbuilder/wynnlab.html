<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WynnLab</title>
    <link rel="stylesheet" href="wynnlab.css">
    <script defer src="wynnlab.js"></script>
</head>
<body>
    <div class="sidebar">
        <h1>WynnLab</h1>
        <button id="btn-builder" class="active">WynnBuilder</button>
        <button id="btn-calc">WynnCalc</button>
        <button id="btn-atlas">WynnAtlas</button>
        <button id="btn-crafter">WynnCrafter</button>
    </div>

    <main id="main-content">
        <div id="builder-content">This is WynnBuilder</div>

        <div id="calc-content" class="hidden">This is WynnCalc</div>

        <div id="atlas-content" class="hidden">
            <div id="atlas-canvas">
                <div class="atlas-search-row">
                    <input type="text" placeholder="Search Items" class="atlas-search-input" />
                </div>
                <div class="atlas-spacer">
                    <div class="atlas-type-filter">
                        <h3>Type Filter</h3>
                        <span class="atlas-filter-line"></span>
                        <div class="atlas-type-filters">
                            <div class="atlas-type-filter-item" id="item-category">
                                <p>Item Category</p>
                                <select class="atlas-dropdown atlas-category-dropdown">
                                    <option value="">ANY</option>
                                    <option value="placeholder1">Placeholder 1</option>
                                    <option value="placeholder2">Placeholder 2</option>
                                    <option value="placeholder3">Placeholder 3</option>
                                </select>
                            </div>
                            <div class="atlas-type-filter-item" id="item-rarity">
                                <p>Item Rarity</p>
                                <select class="atlas-dropdown atlas-rarity-dropdown">
                                    <option value="">ANY</option>
                                    <option value="placeholderA">Placeholder A</option>
                                    <option value="placeholderB">Placeholder B</option>
                                    <option value="placeholderC">Placeholder C</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="atlas-weapon-filter">
                            <h3>Weapon Filter</h3>
                            <span class="atlas-filter-line"></span>
                            <div class="atlas-weapon-filter-row">
                                <div class="atlas-weapon-filter-item">
                                    <p>Base DPS</p>
                                    <div class="atlas-weapon-minmax-group">
                                        <input type="number" class="atlas-weapon-min" placeholder="Min" min="0" />
                                        <input type="number" class="atlas-weapon-max" placeholder="Max" min="0" />
                                    </div>
                                </div>
                                <div class="atlas-weapon-filter-item">
                                    <p>Earth Damage</p>
                                    <div class="atlas-weapon-minmax-group">
                                        <input type="number" class="atlas-weapon-min" placeholder="Min" min="0" />
                                        <input type="number" class="atlas-weapon-max" placeholder="Max" min="0" />
                                    </div>
                                </div>
                                <div class="atlas-weapon-filter-item">
                                    <p>Thunder Damage</p>
                                    <div class="atlas-weapon-minmax-group">
                                        <input type="number" class="atlas-weapon-min" placeholder="Min" min="0" />
                                        <input type="number" class="atlas-weapon-max" placeholder="Max" min="0" />
                                    </div>
                                </div>
                                <div class="atlas-weapon-filter-item">
                                    <p>Water Damage</p>
                                    <div class="atlas-weapon-minmax-group">
                                        <input type="number" class="atlas-weapon-min" placeholder="Min" min="0" />
                                        <input type="number" class="atlas-weapon-max" placeholder="Max" min="0" />
                                    </div>
                                </div>
                                <div class="atlas-weapon-filter-item">
                                    <p>Fire Damage</p>
                                    <div class="atlas-weapon-minmax-group">
                                        <input type="number" class="atlas-weapon-min" placeholder="Min" min="0" />
                                        <input type="number" class="atlas-weapon-max" placeholder="Max" min="0" />
                                    </div>
                                </div>
                                <div class="atlas-weapon-filter-item">
                                    <p>Air Damage</p>
                                    <div class="atlas-weapon-minmax-group">
                                        <input type="number" class="atlas-weapon-min" placeholder="Min" min="0" />
                                        <input type="number" class="atlas-weapon-max" placeholder="Max" min="0" />
                                    </div>
                                </div>
                                <div class="atlas-weapon-filter-item">
                                    <p>Attack Speed</p>
                                    <select class="atlas-dropdown atlas-weapon-speed-dropdown">
                                        <option value="">ANY</option>
                                        <option value="super_slow">Super Slow</option>
                                        <option value="very_slow">Very Slow</option>
                                        <option value="slow">Slow</option>
                                        <option value="normal">Normal</option>
                                        <option value="fast">Fast</option>
                                        <option value="very_fast">Very Fast</option>
                                        <option value="super_fast">Super Fast</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="atlas-stat-filter">
                        <h3>Stat Filter</h3>
                        <span class="atlas-filter-line"></span>
                        <div class="atlas-stat-filter-row">
                            <div class="atlas-stat-filter-item">
                                <p>Stat Group</p>
                                <select class="atlas-dropdown atlas-stat-group-dropdown">
                                    <option value="">ANY</option>
                                    <option value="HAS">HAS</option>
                                    <option value="NOT">NOT</option>
                                    <option value="COUNT">COUNT</option>
                                    <option value="WEIGHT">WEIGHT</option>
                                </select>
                            </div>
                        </div>
                        <div class="atlas-stat-filters-list"></div>
                    </div>
                </div>
                <div class="atlas-search-btn-row">
                    <button class="atlas-search-btn">Search</button>
                </div>
            </div>
        </div>

        <div id="crafter-content" class="hidden">This is WynnCrafter</div>
    </main>
</body>
</html>
